[package]
name = "archimate-cli"
description = "Command-line tool for ArchiMate models (Archi .archimate files)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "archimate"
path = "src/main.rs"

[dependencies]
archimate-core.workspace = true
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
